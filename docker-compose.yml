services:
  nginx:
    image: nginx:alpine
    #  links: ['mysql', 'sqlserver', 'redis', 'dbms', 'docker', 'php5', 'php7', 'php8.0', 'php8.2', 'node18']
    networks:
      default:
        ipv4_address: 172.18.128.10
    ports:
      - 80:80
      - 443:443
    depends_on:
      sites:
        condition: service_completed_successfully
    volumes:
      - project:/project
      - ./generated/nginx:/etc/nginx/conf.d
      - ./nginx/snippets:/etc/nginx/snippets
      - ./nginx/server.key:/etc/ssl/server.key
      - ./nginx/server.crt:/etc/ssl/server.crt

  dns:
    build: ./dns
    image: local-dns
    depends_on:
      sites:
        condition: service_completed_successfully
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf
      - ./generated:/generated:ro
    networks:
      default:
        ipv4_address: 172.18.128.53

  sites:
    build: ./sites
    image: local-sites
    env_file:
      - path: .env
        required: false
    environment:
      - NGINX_IP=172.18.128.10
      - DNS_IP=172.18.128.53
    volumes:
      - ./sites/generate.js:/app/generate.js:ro
      - ./:/work:ro
      - ./generated:/generated

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          ip_range: 172.18.0.0/17   # 自動割り当て用。172.18.128.0/17 は固定 IP 用

volumes:
  project:
    external: true
